version: '3.8'

services:
  # Database Service (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: devops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # Backend REST API Service
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-backend-api
    restart: always
    environment:
      PORT: 5000
      DB_HOST: postgres-db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: devops_db
      DB_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      - postgres-db
    networks:
      - app_network

  # Frontend Web UI (React + NGINX)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: